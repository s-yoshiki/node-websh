name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: End-to-end smoke test
        run: pnpm run test:e2e

  package:
    name: Release bundle
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # A ready-to-run bundle: the server, the built frontend beside it, and a
      # package.json whose only dependency is the native PTY addon.
      - name: Pack
        run: tar czf node-websh-dist.tar.gz -C apps/server dist

      - uses: actions/upload-artifact@v4
        with:
          name: node-websh-dist
          path: node-websh-dist.tar.gz
          if-no-files-found: error
