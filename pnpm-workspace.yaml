packages:
  - 'apps/*'
  - 'configs/*'
  - 'packages/*'
  - 'infra/*'
  - 'scripts/*'
  - 'docs/*'

minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.0.5'
  - vite@8.2.0

# node-pty compiles a native addon and esbuild ships a platform binary, so both
# need their install scripts to run. pnpm requires that to be explicit.
allowBuilds:
  esbuild: true
  node-pty: true

catalog:
  '@hono/node-server': '^2.0.12'
  '@hono/node-ws': '^1.3.1'
  '@types/node': '^26.0.0'
  '@types/react': '^19.0.0'
  '@types/react-dom': '^19.0.0'
  '@types/ws': '^8.18.1'
  '@vitejs/plugin-react': '^6.0.5'
  '@xterm/addon-clipboard': '^0.2.0'
  '@xterm/addon-fit': '^0.11.0'
  '@xterm/addon-search': '^0.16.0'
  '@xterm/addon-unicode11': '^0.9.0'
  '@xterm/addon-web-links': '^0.12.0'
  '@xterm/addon-webgl': '^0.19.0'
  '@xterm/xterm': '^6.0.0'
  'esbuild': '^0.27.0'
  'hono': '^4.12.32'
  'node-pty': '^1.1.0'
  'oxfmt': '0.78.0'
  'oxlint': '1.93.0'
  'postject': '1.0.0-alpha.6'
  'react': '^19.2.8'
  'react-dom': '^19.2.8'
  'tsx': '^4.20.6'
  'turbo': '2.11.11'
  'typescript': '>=7.0.0'
  'vite': '^8.2.0'
  'ws': '^8.21.1'
