name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: End-to-end smoke test
        run: pnpm run test:e2e

  package:
    name: Release bundle
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # A ready-to-run bundle: the server, the built frontend beside it, and a
      # package.json whose only dependency is the native PTY addon.
      - name: Pack
        run: tar czf node-websh-dist.tar.gz -C apps/server dist

      - uses: actions/upload-artifact@v4
        with:
          name: node-websh-dist
          path: node-websh-dist.tar.gz
          if-no-files-found: error
